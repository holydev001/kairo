appId: dev.holydev.kairo
productName: Kairo
copyright: Copyright © 2026 holydev001

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/sql.js/dist/sql-wasm.wasm

win:
  executableName: Kairo
  icon: build/icon.svg
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Kairo-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Kairo
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: holydev001
  repo: kairo
  releaseType: prerelease
